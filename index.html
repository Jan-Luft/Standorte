<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow">
  <title>Standortkarte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="passwordGate" class="password-gate">
    <form id="passwordForm" class="password-card">
      <h1>Karte öffnen</h1>
      <p>Bitte Passwort eingeben.</p>

      <input
        id="passwordInput"
        type="password"
        placeholder="Passwort"
        autocomplete="current-password"
        required
      />

    <button type="submit">Öffnen</button>
    <div id="passwordError" class="password-error" hidden>Passwort falsch.</div>
   </form>
  </div>
  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <h1>Standortkarte</h1>
          <p>Suche nach Name, Adresse oder RG. Ein RG-Filter blendet alle anderen Standorte auf der Karte aus.</p>
        </div>
      </div>

      <div class="control-group">
        <label for="searchInput">Suche</label>
        <input id="searchInput" type="text" placeholder="Name, Adresse oder RG" />
      </div>

      <div class="control-group">
        <label for="rgFilter">RG filtern</label>
        <select id="rgFilter">
          <option value="">Keine Auswahl</option>
        </select>
      </div>

      <div class="button-row">
        <button id="resetBtn" type="button">Zurücksetzen</button>
        <button id="fitBtn" type="button">Alle Treffer zeigen</button>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="dot dot-primary"></span>aktuelle Treffer auf der Karte</div>
      </div>

      <div id="summary" class="summary"></div>
      <div id="emptyState" class="empty-state" hidden>Keine Treffer für diese Auswahl.</div>
      <ul id="resultList" class="result-list"></ul>
    </aside>

    <main class="map-panel">
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
